name: Worker image (GHCR)

# Builds worker/ (the RunPod digitization worker) and pushes it to GHCR so you
# can point a RunPod Serverless endpoint at the published image. Path-filtered
# to worker/** so app-only changes never trigger it, and it runs on the
# GitHub-hosted amd64 runner (RunPod GPUs are x86_64) — NOT the self-hosted
# app-server runner used by deploy.yml.
on:
  push:
    branches: [dressnation, main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-image.yml'
  pull_request:
    branches: [dressnation, main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-image.yml'
  workflow_dispatch:

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runpod/pytorch CUDA base + pip wheels (transformers, bitsandbytes,
      # timm) are multi-GB; GitHub runners ship only ~14 GB free. Reclaim the
      # preinstalled SDKs we don't need so the build can't fail on
      # "no space left on device".
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # GHCR image refs must be lowercase; the account/org login may not be.
      - name: Compute image ref
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dressnation-worker" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'dressnation' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request we build to validate the Dockerfile but do NOT push
      # (no credentials needed); on a branch push we build and push.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
