name: CI & Deploy

on:
  push:
    branches: [main, dressnation]
  pull_request:
    branches: [main, dressnation]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    # Deploy only on a direct push to the deploy branch (change to main for
    # production). Runs on the self-hosted runner registered on the server.
    if: github.ref == 'refs/heads/dressnation' && github.event_name == 'push'
    runs-on: [self-hosted, whatsapp-bot]
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve the server's .env + named-volume data (both gitignored /
          # outside the checkout). Without this, git clean wipes .env.
          clean: false

      - name: Rebuild and restart the stack
        run: docker compose up --build -d

      - name: Prune dangling images
        run: docker image prune -f
