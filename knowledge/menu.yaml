greeting: |
  Karibu! Welcome to [BUSINESS NAME] 👋

fallback: |
  Sorry, I didn't quite get that. / Samahani, sijaelewa.
  Reply with a number: / Jibu kwa nambari:

after_hours: |
  Thanks for your message! We are currently closed (Mon–Sat 08:00–18:00) and
  will get back to you during business hours.
  Asante kwa ujumbe wako! Kwa sasa tumefunga — tutakujibu saa za kazi.

media_ack: |
  Thanks for sending that! A member of our team will take a look shortly.
  Asante! Mmoja wa timu yetu ataangalia hivi karibuni.

