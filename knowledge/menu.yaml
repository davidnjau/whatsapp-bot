greeting: |
  Karibu Dress Nation ~254! 💃 Quality mtumba dresses, delivered countrywide
  via Pickup Mtaani.

fallback: |
  Samahani, sijaelewa vizuri. Reply with a number / Jibu kwa nambari:

after_hours: |
  Asante kwa ujumbe wako! Tuko offline kwa sasa — tutakujibu saa za kazi.
  Thanks for your message! We're currently offline and will reply during
  business hours.

media_ack: |
  Nice pick! 😍 Let me confirm this dress is still available — a team member
  will get back to you shortly. Kumbuka: hatuna refunds wala exchanges, so
  feel free to ask for measurements or a video kwanza.

menu:
  - key: "1"
    title: "Order a dress / Kuagiza dress"
    keywords: [order, buy, available, iko, bado, nataka hii, niaje hii, how to order, kuagiza]
    reply: |
      Easy! 😊 Send a screenshot of the dress (or tell us which video it's
      from) and we'll confirm it's still available, the size and the price
      (usually Ksh 1,000 — confirm per dress). Each dress is a single piece!
      Since we have no refunds/exchanges, ask for measurements or a video
      kwanza ukitaka. Ukishachagua, we arrange Pickup Mtaani delivery.

  - key: "2"
    title: "Delivery & fees / Usafirishaji"
    keywords: [delivery, deliver, fee, pickup, mtaani, doorstep, usafirishaji, kufika, utafika, shipping]
    reply: |
      We deliver countrywide via Pickup Mtaani 🇰🇪
      • Agent pickup (cheapest) — collect at your nearest Pickup Mtaani agent
      • Doorstep — rider delivers to your door
      • Upcountry — via matatu SACCO/courier you choose (e.g. Easy Coach, 2NK)
      Tuambie area/town yako na tutaconfirm the delivery fee. Delivery fee is
      separate from the dress price.

  - key: "3"
    title: "Track my order / Kufuatilia order"
    keywords: [track, tracking, package code, parcel, imefika, iko wapi, status ya order]
    reply: |
      Once we drop your dress with Pickup Mtaani, we send you a package code —
      track it on the Pickup Mtaani website. Ikifika kwa agent, please collect
      within 3 days (after that parcels are returned and can eventually be
      disposed of). Open and check your parcel at the agent before leaving! 🙌

  - key: "4"
    title: "Policies / Sheria za duka"
    keywords: [refund, exchange, return, kubadilisha, kurudisha, policy, sheria]
    reply: |
      Mtumba items are sold as they are: ❌ no refunds, ❌ no exchanges.
      Ndio maana we encourage you to check the size against your measurements
      and ask for close-up photos/video before paying. Honest descriptions
      always — tell us if you want a condition check on any dress.

  - key: "0"
    title: "Talk to a person / Ongea na mtu"
    keywords: [human, agent, person, mtu, msaada, owner, mwenye duka, customer care]
    handoff: true
